<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.2.9/dist/hls.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Firebase configuration (replace with your Firebase project config)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Main App Component
    function App() {
      const [user, setUser] = useState(null);
      const [videos, setVideos] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");

      // Authentication state
      useEffect(() => {
        auth.onAuthStateChanged((user) => {
          setUser(user);
        });
      }, []);

      // Fetch videos from Firestore
      useEffect(() => {
        db.collection("videos")
          .orderBy("createdAt", "desc")
          .onSnapshot((snapshot) => {
            const videoData = snapshot.docs.map((doc) => ({
              id: doc.id,
              ...doc.data(),
            }));
            setVideos(videoData);
          });
      }, []);

      // Handle login
      const handleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await auth.signInWithPopup(provider);
        } catch (error) {
          console.error("Login error:", error);
        }
      };

      // Handle logout
      const handleLogout = async () => {
        try {
          await auth.signOut();
        } catch (error) {
          console.error("Logout error:", error);
        }
      };

      // Handle video upload
      const handleUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const storageRef = storage.ref(`videos/${file.name}`);
        const uploadTask = storageRef.put(file);
        uploadTask.on(
          "state_changed",
          null,
          (error) => console.error("Upload error:", error),
          async () => {
            const url = await storageRef.getDownloadURL();
            await db.collection("videos").add({
              title: file.name,
              url,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              userId: user.uid,
              likes: 0,
              comments: [],
            });
          }
        );
      };

      // Handle like
      const handleLike = async (videoId) => {
        await db.collection("videos").doc(videoId).update({
          likes: firebase.firestore.FieldValue.increment(1),
        });
      };

      // Handle comment
      const handleComment = async (videoId, comment) => {
        await db.collection("videos").doc(videoId).update({
          comments: firebase.firestore.FieldValue.arrayUnion({
            text: comment,
            userId: user.uid,
            createdAt: new Date().toISOString(),
          }),
        });
      };

      // Filter videos by search query
      const filteredVideos = videos.filter((video) =>
        video.title.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="container mx-auto p-4">
          <header className="flex justify-between items-center mb-4">
            <h1 className="text-2xl font-bold">YouTube Clone</h1>
            <div>
              {user ? (
                <>
                  <span className="mr-4">Welcome, {user.displayName}</span>
                  <button
                    onClick={handleLogout}
                    className="bg-red-500 text-white px-4 py-2 rounded"
                  >
                    Logout
                  </button>
                </>
              ) : (
                <button
                  onClick={handleLogin}
                  className="bg-blue-500 text-white px-4 py-2 rounded"
                >
                  Login with Google
                </button>
              )}
            </div>
          </header>

          <input
            type="text"
            placeholder="Search videos..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            className="w-full p-2 mb-4 border rounded"
          />

          {user && (
            <div className="mb-4">
              <label className="block mb-2">Upload Video</label>
              <input
                type="file"
                accept="video/*"
                onChange={handleUpload}
                className="border p-2"
              />
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            {filteredVideos.map((video) => (
              <VideoCard
                key={video.id}
                video={video}
                onLike={() => handleLike(video.id)}
                onComment={handleComment}
              />
            ))}
          </div>
        </div>
      );
    }

    // Video Card Component
    function VideoCard({ video, onLike, onComment }) {
      const [comment, setComment] = useState("");

      const handleCommentSubmit = (e) => {
        e.preventDefault();
        if (comment.trim()) {
          onComment(video.id, comment);
          setComment("");
        }
      };

      return (
        <div className="border rounded-lg p-4">
          <VideoPlayer url={video.url} />
          <h2 className="text-lg font-semibold mt-2">{video.title}</h2>
          <button
            onClick={onLike}
            className="bg-green-500 text-white px-2 py-1 rounded mt-2"
          >
            Like ({video.likes})
          </button>
          <form onSubmit={handleCommentSubmit} className="mt-2">
            <input
              type="text"
              value={comment}
              onChange={(e) => setComment(e.target.value)}
              placeholder="Add a comment..."
              className="w-full p-2 border rounded"
            />
            <button
              type="submit"
              className="bg-blue-500 text-white px-2 py-1 rounded mt-2"
            >
              Comment
            </button>
          </form>
          <div className="mt-2">
            {video.comments.map((c, i) => (
              <p key={i} className="text-sm">
                {c.text}
              </p>
            ))}
          </div>
        </div>
      );
    }

    // Video Player Component
    function VideoPlayer({ url }) {
      const videoRef = React.useRef(null);

      useEffect(() => {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(videoRef.current);
        } else if (videoRef.current.canPlayType("application/vnd.apple.mpegurl")) {
          videoRef.current.src = url;
        }
      }, [url]);

      return (
        <video
          ref={videoRef}
          controls
          className="w-full h-48 object-cover"
        ></video>
      );
    }

    // Render App
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
